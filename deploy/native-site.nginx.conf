# Include inside your TLS server block. Change ports if the node uses another base.
# Static deployments use an atomic symlink: /var/www/neuroshard/current.
root /var/www/neuroshard/current/site;
index index.html;
client_max_body_size 32k;
include /etc/nginx/snippets/neuroshard-security-headers.conf;
# Never serve dotfiles or editor/backup leftovers (.git, .env, *.bak, ~).
location ~ /\.(?!well-known/) { return 404; }
location ~ (\.(bak|orig|swp|old|tmp|tgz|tar|gz|zip|sql|env)|~)$ { return 404; }

location /api/auth/ { default_type application/json; return 410 '{"error":"Website registration has retired. Generate native keys locally; see /join."}'; }
location ~ ^/api/(login|register|signup|token|users|waitlist|chat|admin|wallet)(/|$) {
    default_type application/json;
    return 410 '{"error":"This prototype endpoint has retired. See /join for the native network."}';
}
location ~ ^/(signup|login|register|dashboard|download|token)/?$ { return 302 /join; }
location = /native-preview { return 308 /; }
# Preserve GET and signed POST semantics for existing native-preview clients.
location /native-preview/ {
    rewrite ^/native-preview/(api|network|work)/(.*)$ /$1/$2 last;
    rewrite ^/native-preview/(rpc|healthz)$ /$1 last;
    rewrite ^/native-preview/(.*)$ /$1 permanent;
}

location /assistant/ {
    limit_except GET { deny all; }
    limit_req zone=neuroshard_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:39670/assistant/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
location = /join.sh { return 302 https://raw.githubusercontent.com/neuroshard-ai/neuroshard/pilot-2/scripts/join.sh; }  # the current reviewed release; change with each release
location /api/ {
    limit_req zone=neuroshard_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:39659/api/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 100s;
}
location = /network { try_files /index.html =404; add_header Cache-Control no-cache; include /etc/nginx/snippets/neuroshard-security-headers.conf; }
location /network/ {
    proxy_pass http://127.0.0.1:39659/network/;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /healthz {
    proxy_pass http://127.0.0.1:39659/healthz;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /rpc {
    limit_req zone=neuroshard_rpc burst=10 nodelay;
    proxy_pass http://127.0.0.1:39659/rpc;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 100s;
}
location /work/ {
    limit_req zone=neuroshard_rpc burst=10 nodelay;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:39660/work/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 100s;
}
location /docs/ {
    types { }
    default_type text/plain;
    try_files $uri =404;
}
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/neuroshard-security-headers.conf;
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control no-cache;
    include /etc/nginx/snippets/neuroshard-security-headers.conf;
}

# Curated hash-addressed public model/data only. Keep private keys and audits elsewhere.
location /artifacts/ { alias /var/www/neuroshard/artifacts/; autoindex off; }
# Optional retained v0.3 gateway; remove this location on deployments without one.
location /reference/v03/api/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:38659/api/;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /native-preview/release.json { alias /var/www/neuroshard/native-preview/release.json; default_type application/json; }
location /native-preview/releases/ { alias /var/www/neuroshard/native-preview/releases/; }
location = /api/whitepaper/pdf { return 302 /papers/FINE2026_neuroshard_short.pdf; }
