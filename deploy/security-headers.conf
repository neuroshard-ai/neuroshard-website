# Security headers for neuroshard.com.
# The site is a static single-page app: every script, style, font and image is served from its own origin, and
# its only network request is the read-only explorer at /assistant/. Anything else is blocked by the policy below.
# The JSON-LD block in index.html is data (type application/ld+json), which CSP does not execute.
# Included at server level AND in every location that sets its own add_header: nginx drops inherited add_header
# directives in any location that defines one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
