# http-context rate-limit zones for neuroshard.com (install as /etc/nginx/conf.d/neuroshard-ratelimit.conf).
# Per client IP: read APIs 10 requests/s, transaction endpoints 2/s, with bursts; excess gets 429.
limit_req_zone $binary_remote_addr zone=neuroshard_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=neuroshard_rpc:10m rate=2r/s;
limit_req_status 429;
server_tokens off;
